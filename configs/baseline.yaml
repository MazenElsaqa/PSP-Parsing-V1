ocr:
  enabled: true
  force_full_page: false
  languages: [en]
tables:
  mode: accurate
  do_cell_matching: true
image_scale: 2.0
generate_page_images: true
generate_picture_images: true
repeated_text_min_pages: 3
captions:
  enabled: true
  model: gemini-2.0-flash
  max_output_tokens: 220
  skip_kinds: [logo/icon]
qa:
  expected_pages: 27
  minimum_text_characters: 100
  maximum_heading_level_jump: 1
  minimum_table_fill_ratio: 0.5
