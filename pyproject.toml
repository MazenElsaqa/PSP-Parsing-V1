[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "psp-parsing"
version = "0.1.0"
description = "Structure-preserving PDF parsing experiments with Docling"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "docling>=2.48,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pandas>=2.3,<4",
  "Pillow>=11,<13",
  "opencv-python>=4.11,<5",
  "jinja2>=3.1,<4",
  "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.4,<5", "ipywidgets>=8.1,<9"]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<8", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
psp-parse = "psp_parsing.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/psp_parsing"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["psp_parsing"]
